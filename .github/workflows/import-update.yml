name: Import public update payload
on:
  push:
    paths:
      - '.github/workflows/import-update.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch checked update payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-5c60-81fa-856e-aaa8892f88c3/raw?se=2026-11-01T08%3A21%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=ef50558a-f297-5737-9d5d-5aa805f60a88&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T02%3A45%3A16Z&ske=2026-11-02T02%3A45%3A16Z&sks=b&skv=2026-02-06&sig=I20MRtD1Uy/LvuMFCaZNCpQ0ViSbDUIJRYxNEvwYiew%3D' -o /tmp/payload.zip
          unzip -o /tmp/payload.zip -d /tmp/payload
          echo 'b7c768b8b5f572a5b07475c6a5cf188a3322d8635becbba26917804d20172d0d  /tmp/payload/CatPet-Fold3-V0100.apk' | sha256sum -c
          cp /tmp/payload/CatPet-Fold3-V0100.apk .
          cp /tmp/payload/latest.json .
          python3 - <<'PY'
          import json,hashlib,os
          p=json.load(open('latest.json'))
          b=open('CatPet-Fold3-V0100.apk','rb').read()
          assert p['size']==len(b) and p['sha256']==hashlib.sha256(b).hexdigest()
          assert p['versionCode']==11
          PY
      - name: Commit published APK and manifest
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json CatPet-Fold3-V0100.apk
          git commit -m "Publish signed V0.10 update package"
          git push
