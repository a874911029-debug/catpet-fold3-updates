name: Verified V0.17 import
on:
  push:
    paths:
      - '.github/workflows/import-v0170.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify APK release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-de9c-81fa-a3ee-bbb6ff711772/raw?se=2026-11-01T10%3A55%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=6da30a9c-c2ee-5d14-8eac-b03e669156c5&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T00%3A46%3A18Z&ske=2026-11-02T00%3A46%3A18Z&sks=b&skv=2026-02-06&sig=vSa%2BVgw1qlGsYH6O1AX2N4zoESOWnpY%2B0BuAxmsIzDQ%3D' -o /tmp/catpet_v0170.zip
          mkdir -p /tmp/catpet_v0170
          unzip -o /tmp/catpet_v0170.zip -d /tmp/catpet_v0170
          echo 'dee9b6ce53c700dfad2d6c26b76229a6c148b1eebccc99fa51ac2f9e9591a40e  /tmp/catpet_v0170/CatPet-Fold3-V0170.apk' | sha256sum -c
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          p='/tmp/catpet_v0170/CatPet-Fold3-V0170.apk'
          m=json.load(open('/tmp/catpet_v0170/latest.json'))
          assert m['versionCode']==18 and m['versionName']=='0.17.0-test'
          assert m['size']==os.path.getsize(p)
          assert m['sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert m['apkUrl']=='https://raw.githubusercontent.com/a874911029-debug/catpet-fold3-updates/main/CatPet-Fold3-V0170.apk'
          with zipfile.ZipFile(p) as z:
              art=z.read('assets/cat07_default.webp')
          assert hashlib.sha256(art).hexdigest()=='ffb2c984e9064b1684bc412b6ae26e6f88aa79821718af067743c5ca818317a9'
          PY
          cp /tmp/catpet_v0170/CatPet-Fold3-V0170.apk .
          cp /tmp/catpet_v0170/latest.json .
      - name: Publish signed update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CatPet-Fold3-V0170.apk latest.json
          git commit -m "Publish signed CatPet V0.17 mesh-motion experiment"
          git push
