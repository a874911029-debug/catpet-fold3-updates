name: One-time verified V0.14 package publishing
on:
  push:
    paths:
      - '.github/workflows/import-v0140.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-7228-81fa-a598-6edfdbdd93bf/raw?se=2026-11-01T10%3A02%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=bbbea72c-4315-5430-b7bb-1ceb9b9955c9&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T06%3A36%3A11Z&ske=2026-11-02T06%3A36%3A11Z&sks=b&skv=2026-02-06&sig=HJJABSRL7DxDDpktdfeTv3lRyGtnzEiQnZqNae5PpMs%3D' -o /tmp/catpet-v0140.zip
          mkdir -p /tmp/catpet-v0140
          unzip -o /tmp/catpet-v0140.zip -d /tmp/catpet-v0140
          echo '8061896e95f94ac40443d48812134a43100ccba516f65c6689eeebb63df21e6b  /tmp/catpet-v0140/CatPet-Fold3-V0140.apk' | sha256sum -c
          python3 - <<'PY'
          import os,hashlib,json
          j=json.load(open('/tmp/catpet-v0140/latest.json'))
          p='/tmp/catpet-v0140/CatPet-Fold3-V0140.apk'
          assert j['versionCode']==15 and j['versionName']=='0.14.0-test'
          assert j['size']==os.stat(p).st_size
          assert j['sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert j['apkUrl']=='https://raw.githubusercontent.com/a874911029-debug/catpet-fold3-updates/main/CatPet-Fold3-V0140.apk'
          PY
          cp /tmp/catpet-v0140/CatPet-Fold3-V0140.apk .
          cp /tmp/catpet-v0140/latest.json .
      - name: Publish verified V0.14 APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CatPet-Fold3-V0140.apk latest.json
          git commit -m 'Publish CatPet V0.14 spritepack importer'
          git push
