name: One-time verified V0.11 import
on:
  push:
    paths:
      - '.github/workflows/import-v0110.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and publish APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-fc20-81fa-9302-ced3937ca833/raw?se=2026-11-01T08%3A34%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=b1d29265-0a24-502b-a6b9-f95fc4bb791c&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T22%3A35%3A41Z&ske=2026-11-01T22%3A35%3A41Z&sks=b&skv=2026-02-06&sig=q/%2Bo4%2BZ84DiCzZF5ZPH9EAexyEMxJamG1dSt3HGMVTs%3D' -o /tmp/package.zip
          mkdir -p /tmp/catpet-release
          unzip -o /tmp/package.zip -d /tmp/catpet-release
          echo '7924604a2bbf774d2bc03eeaf9398a9da61e293faa6994b2426f8850eb794dca  /tmp/catpet-release/CatPet-Fold3-V0110.apk' | sha256sum -c
          python3 - <<'PY'
          import json,hashlib,os
          p=json.load(open('/tmp/catpet-release/latest.json'))
          path='/tmp/catpet-release/CatPet-Fold3-V0110.apk'
          assert p['versionCode']==12
          assert p['size']==os.path.getsize(path)
          assert p['sha256']==hashlib.sha256(open(path,'rb').read()).hexdigest()
          assert p['apkUrl']=='https://raw.githubusercontent.com/a874911029-debug/catpet-fold3-updates/main/CatPet-Fold3-V0110.apk'
          PY
          cp /tmp/catpet-release/CatPet-Fold3-V0110.apk .
          cp /tmp/catpet-release/latest.json .
      - name: Commit published update files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CatPet-Fold3-V0110.apk latest.json
          git commit -m "Publish signed CatPet V0.11 update"
          git push
