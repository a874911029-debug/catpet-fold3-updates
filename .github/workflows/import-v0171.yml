name: Verified V0.17.1 update-check repair publish
on:
  push:
    paths:
      - '.github/workflows/import-v0171.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify update package and publish APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-5b1c-81fa-a55c-6eb09cc434cf/raw?se=2026-11-01T11%3A02%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=f8fbb598-054c-5edf-ac09-256e199374de&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T03%3A02%3A24Z&ske=2026-11-02T03%3A02%3A24Z&sks=b&skv=2026-02-06&sig=FxgRKlfHXJmQl/wUaXSWe7dsxwwpQN8O3qbxeQEJKQA%3D' -o /tmp/catpet_v0171.zip
          mkdir -p /tmp/catpet_v0171
          unzip -o /tmp/catpet_v0171.zip -d /tmp/catpet_v0171
          echo 'cf737daf991838d526016bfb0c5da28b760a0c2824df44d7d8454bab50d95a51  /tmp/catpet_v0171/CatPet-Fold3-V0171.apk' | sha256sum -c
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          p='/tmp/catpet_v0171/CatPet-Fold3-V0171.apk'
          m=json.load(open('/tmp/catpet_v0171/latest.json'))
          assert m['versionCode']==19 and m['versionName']=='0.17.1-test'
          assert m['size']==os.path.getsize(p)
          assert m['sha256']==hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert m['apkUrl']=='https://raw.githubusercontent.com/a874911029-debug/catpet-fold3-updates/main/CatPet-Fold3-V0171.apk'
          with zipfile.ZipFile(p) as z:
              art=z.read('assets/cat07_default.webp')
          assert hashlib.sha256(art).hexdigest()=='ffb2c984e9064b1684bc412b6ae26e6f88aa79821718af067743c5ca818317a9'
          PY
          cp /tmp/catpet_v0171/CatPet-Fold3-V0171.apk .
          cp /tmp/catpet_v0171/latest.json .
      - name: Commit update files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CatPet-Fold3-V0171.apk latest.json
          git commit -m "Publish signed V0.17.1 improved updater"
          git push
