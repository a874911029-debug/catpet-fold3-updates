name: One-time verified V0.13 import
on:
  push:
    paths:
      - '.github/workflows/import-v0130.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify signed V0.13 release package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-41a4-81fa-9855-33cc531eb5cc/raw?se=2026-11-01T09%3A35%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=f31f5aca-58ef-5e7a-99ee-524157822198&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T06%3A52%3A01Z&ske=2026-11-02T06%3A52%3A01Z&sks=b&skv=2026-02-06&sig=b49xR8Rc%2BabFNHCh50c4b49rtJH%2BGMWqoiUuhQN4JgE%3D' -o /tmp/catpet_v0130.zip
          mkdir -p /tmp/catpet_v0130
          unzip -o /tmp/catpet_v0130.zip -d /tmp/catpet_v0130
          echo '101d38bb577e761b6353384c8c8918247bc12b75a7ed240b3ffb14720c2cfc4c  /tmp/catpet_v0130/CatPet-Fold3-V0130.apk' | sha256sum -c
          python3 - <<'PY'
          import hashlib,json,os
          path='/tmp/catpet_v0130/CatPet-Fold3-V0130.apk'
          p=json.load(open('/tmp/catpet_v0130/latest.json'))
          assert p['versionCode']==14 and p['versionName']=='0.13.0-test'
          assert p['sha256']==hashlib.sha256(open(path,'rb').read()).hexdigest()
          assert p['size']==os.path.getsize(path)
          assert p['apkUrl']=='https://raw.githubusercontent.com/a874911029-debug/catpet-fold3-updates/main/CatPet-Fold3-V0130.apk'
          PY
          cp /tmp/catpet_v0130/CatPet-Fold3-V0130.apk .
          cp /tmp/catpet_v0130/latest.json .
      - name: Commit verified release to public update channel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CatPet-Fold3-V0130.apk latest.json
          git commit -m "Publish signed CatPet V0.13 update"
          git push
